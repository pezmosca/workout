
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.app{max-width:420px;margin:0 auto;padding:12px}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.top-bar h1{font-size:17px;font-weight:500;color:var(--color-text-primary)}
.workout-toggle{display:flex;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);overflow:hidden}
.workout-toggle button{padding:6px 14px;font-size:13px;font-weight:500;border:none;background:transparent;color:var(--color-text-secondary);cursor:pointer}
.workout-toggle button.active{background:#1D9E75;color:#E1F5EE}
.session-info{font-size:12px;color:var(--color-text-tertiary);margin-bottom:12px}
.exercise-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:10px;overflow:hidden}
.ex-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:0.5px solid var(--color-border-tertiary)}
.ex-name{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.ex-target{font-size:12px;color:var(--color-text-secondary)}
.sets-area{padding:10px 14px}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center;margin-bottom:8px}
.set-label{font-size:12px;color:var(--color-text-tertiary);text-align:center}
.set-col-header{font-size:11px;color:var(--color-text-tertiary);text-align:center}
.set-input{width:100%;padding:6px 8px;font-size:14px;text-align:center;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary)}
.set-input:focus{outline:none;border-color:#1D9E75}
.done-btn{width:32px;height:32px;border-radius:50%;border:0.5px solid var(--color-border-tertiary);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.done-btn.completed{background:#1D9E75;border-color:#1D9E75}
.done-btn svg{width:14px;height:14px}
.prev-weight{font-size:11px;color:var(--color-text-tertiary);text-align:center;padding:0 14px 8px}
.timer-bar{background:#E1F5EE;border-top:0.5px solid #9FE1CB;padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.timer-bar.hidden{display:none}
.timer-label{font-size:12px;color:#085041;font-weight:500}
.timer-count{font-size:20px;font-weight:500;color:#085041;min-width:48px;text-align:right}
.timer-skip{font-size:11px;color:#0F6E56;cursor:pointer;text-decoration:underline;background:none;border:none}
.upgrade-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:var(--border-radius-md);font-weight:500}
.badge-green{background:#E1F5EE;color:#085041}
.badge-amber{background:#FAEEDA;color:#633806}
.badge-gray{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.section-divider{font-size:11px;font-weight:500;color:var(--color-text-tertiary);letter-spacing:0.05em;text-transform:uppercase;margin:16px 0 8px;padding:0 2px}
.history-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;margin-bottom:8px}
.history-date{font-size:12px;color:var(--color-text-tertiary);margin-bottom:6px}
.history-row{display:flex;justify-content:space-between;font-size:13px;color:var(--color-text-primary);padding:2px 0}
.history-val{color:var(--color-text-secondary);font-size:12px}
.nav{display:flex;border-top:0.5px solid var(--color-border-tertiary);margin-top:20px;padding-top:12px;gap:8px}
.nav button{flex:1;padding:9px;font-size:13px;font-weight:500;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);cursor:pointer}
.nav button.active{background:#1D9E75;color:#E1F5EE;border-color:#1D9E75}
</style>

<h2 class="sr-only">Fazer workout tracker — log weights, rest timer, and progression advice</h2>
<div class="app">
  <div class="top-bar">
    <h1>Fazer Tracker</h1>
    <div class="workout-toggle">
      <button class="active" onclick="switchWorkout('A')">Workout A</button>
      <button onclick="switchWorkout('B')">Workout B</button>
    </div>
  </div>
  <div class="session-info" id="session-info">Today · Tuesday</div>

  <div id="workout-view">
    <div id="exercises-container"></div>
    <div class="nav">
      <button class="active" id="nav-log" onclick="showView('log')">Log</button>
      <button id="nav-history" onclick="showView('history')">History</button>
    </div>
  </div>

  <div id="history-view" style="display:none">
    <div class="section-divider">Past sessions</div>
    <div id="history-container"></div>
    <div class="nav">
      <button id="nav-log2" onclick="showView('log')">Log</button>
      <button class="active" id="nav-history2" onclick="showView('history')">History</button>
    </div>
  </div>
</div>

<script>
const WORKOUTS = {
  A: [
    {name:'Squats', sets:3, target:'3x5', rest:180, type:'strength'},
    {name:'Flat Bench', sets:3, target:'3x5', rest:180, type:'strength'},
    {name:'Pull Ups', sets:3, target:'3x Failure', rest:120, type:'failure'},
    {name:'Dips', sets:3, target:'3x Failure', rest:120, type:'failure'},
    {name:'Barbell Bicep Curls', sets:3, target:'3x8-10', rest:90, type:'hypertrophy'},
    {name:'Tricep Extensions', sets:3, target:'3x Failure', rest:90, type:'failure'},
    {name:'Plank', sets:3, target:'3x30-45s', rest:60, type:'abs'},
    {name:'Hanging Knee Raises', sets:3, target:'3x10-15', rest:60, type:'abs'},
    {name:'Weighted Crunches', sets:3, target:'3x12-15', rest:60, type:'abs'},
  ],
  B: [
    {name:'Squats', sets:3, target:'3x5', rest:180, type:'strength'},
    {name:'Incline Bench', sets:3, target:'3x8', rest:150, type:'hypertrophy'},
    {name:'Romanian Deadlift', sets:3, target:'3x8', rest:180, type:'strength'},
    {name:'Dips', sets:3, target:'3x Failure', rest:120, type:'failure'},
    {name:'Rows', sets:2, target:'2x8-10', rest:120, type:'hypertrophy'},
    {name:'Barbell Bicep Curls', sets:3, target:'3x8-10', rest:90, type:'hypertrophy'},
    {name:'Close Grip Bench', sets:3, target:'3x8-10', rest:90, type:'hypertrophy'},
    {name:'Plank', sets:3, target:'3x30-45s', rest:60, type:'abs'},
    {name:'Hanging Knee Raises', sets:3, target:'3x10-15', rest:60, type:'abs'},
    {name:'Weighted Crunches', sets:3, target:'3x12-15', rest:60, type:'abs'},
  ]
};

let currentWorkout = 'A';
let timerInterval = null;
let timerEl = null;
let currentView = 'log';
let sessionData = {};
let history = JSON.parse(localStorage.getItem('fazer_history') || '[]');

function switchWorkout(w) {
  currentWorkout = w;
  document.querySelectorAll('.workout-toggle button').forEach((b,i) => {
    b.classList.toggle('active', (i===0&&w==='A')||(i===1&&w==='B'));
  });
  sessionData = {};
  stopTimer();
  renderExercises();
}

function restLabel(s) {
  return s >= 60 ? Math.floor(s/60)+'m '+(s%60?s%60+'s':'') : s+'s';
}

function getUpgradeBadge(exName, w) {
  const sessions = history.filter(h => h.workout === w);
  const relevant = sessions.filter(h => h.exercises && h.exercises[exName]);
  if (relevant.length < 3) return null;
  const last3 = relevant.slice(-3);
  const allComplete = last3.every(s => {
    const sets = s.exercises[exName];
    return sets && sets.every(set => set.completed);
  });
  if (!allComplete) return null;
  const weights = last3.map(s => {
    const sets = s.exercises[exName];
    return sets ? Math.max(...sets.map(set => parseFloat(set.weight)||0)) : 0;
  });
  const allSameWeight = weights.every(w => w === weights[0]) && weights[0] > 0;
  if (allSameWeight) return 'increase';
  return null;
}

function renderExercises() {
  const container = document.getElementById('exercises-container');
  const exercises = WORKOUTS[currentWorkout];
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('session-info').textContent = 'Today · ' + days[new Date().getDay()];

  container.innerHTML = '';
  exercises.forEach((ex, ei) => {
    if (ei === exercises.length - 3) {
      const div = document.createElement('div');
      div.className = 'section-divider';
      div.textContent = 'Ab finisher';
      container.appendChild(div);
    }

    const badge = getUpgradeBadge(ex.name, currentWorkout);
    const prevSessions = history.filter(h => h.workout === currentWorkout && h.exercises && h.exercises[ex.name]);
    const lastSession = prevSessions.length ? prevSessions[prevSessions.length-1] : null;

    const card = document.createElement('div');
    card.className = 'exercise-card';
    card.id = 'card-'+ei;

    let setsHTML = `<div class="set-row">
      <div class="set-col-header"></div>
      <div class="set-col-header">kg</div>
      <div class="set-col-header">reps</div>
      <div class="set-col-header"></div>
    </div>`;

    for (let s=0; s<ex.sets; s++) {
      const lastWeight = lastSession && lastSession.exercises[ex.name] && lastSession.exercises[ex.name][s] ? lastSession.exercises[ex.name][s].weight : '';
      const lastReps = lastSession && lastSession.exercises[ex.name] && lastSession.exercises[ex.name][s] ? lastSession.exercises[ex.name][s].reps : '';
      setsHTML += `<div class="set-row">
        <div class="set-label" style="font-size:13px;font-weight:500;color:var(--color-text-tertiary)">S${s+1}</div>
        <input class="set-input" type="number" min="0" step="0.5" placeholder="${lastWeight||'kg'}" id="w-${ei}-${s}" inputmode="decimal">
        <input class="set-input" type="number" min="0" step="1" placeholder="${lastReps||'reps'}" id="r-${ei}-${s}" inputmode="numeric">
        <button class="done-btn" id="done-${ei}-${s}" onclick="completeSet(${ei},${s})">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="2,7 6,11 12,3"/>
          </svg>
        </button>
      </div>`;
    }

    let prevHTML = '';
    if (lastSession && lastSession.exercises[ex.name]) {
      const sets = lastSession.exercises[ex.name];
      const maxW = Math.max(...sets.map(s=>parseFloat(s.weight)||0));
      if (maxW > 0) prevHTML = `<div class="prev-weight">Last session: ${maxW}kg</div>`;
    }

    let badgeHTML = '';
    if (badge === 'increase') {
      badgeHTML = `<span class="upgrade-badge badge-amber">+ increase weight</span>`;
    }

    card.innerHTML = `
      <div class="ex-header">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-target">${ex.target} · rest ${restLabel(ex.rest)}</div>
        </div>
        ${badgeHTML}
      </div>
      <div class="sets-area">${setsHTML}</div>
      ${prevHTML}
      <div class="timer-bar hidden" id="timer-${ei}">
        <div class="timer-label">Rest</div>
        <button class="timer-skip" onclick="stopTimer()">skip</button>
        <div class="timer-count" id="timer-count-${ei}">—</div>
      </div>`;
    container.appendChild(card);
  });
}

function completeSet(ei, si) {
  const btn = document.getElementById(`done-${ei}-${si}`);
  const w = document.getElementById(`w-${ei}-${si}`).value;
  const r = document.getElementById(`r-${ei}-${si}`).value;
  btn.classList.toggle('completed');
  const isComplete = btn.classList.contains('completed');

  if (!sessionData[ei]) sessionData[ei] = {};
  sessionData[ei][si] = {weight: w, reps: r, completed: isComplete};

  if (isComplete) {
    const ex = WORKOUTS[currentWorkout][ei];
    startTimer(ei, ex.rest);
    saveToHistory(ei);
  }
}

function startTimer(ei, seconds) {
  stopTimer();
  const bar = document.getElementById(`timer-${ei}`);
  const countEl = document.getElementById(`timer-count-${ei}`);
  bar.classList.remove('hidden');
  timerEl = {bar, countEl};
  let remaining = seconds;
  countEl.textContent = formatTime(remaining);
  timerInterval = setInterval(() => {
    remaining--;
    countEl.textContent = formatTime(remaining);
    if (remaining <= 0) {
      stopTimer();
      bar.classList.add('hidden');
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  if (timerEl) { timerEl.bar.classList.add('hidden'); timerEl = null; }
}

function formatTime(s) {
  if (s <= 0) return 'Go!';
  const m = Math.floor(s/60);
  const sec = s%60;
  return m > 0 ? m+':'+(sec<10?'0':'')+sec : sec+'s';
}

function saveToHistory(ei) {
  const ex = WORKOUTS[currentWorkout][ei];
  const today = new Date().toLocaleDateString('en-GB');
  let todaySession = history.find(h => h.date === today && h.workout === currentWorkout);
  if (!todaySession) {
    todaySession = {date: today, workout: currentWorkout, exercises: {}};
    history.push(todaySession);
  }
  if (!todaySession.exercises[ex.name]) todaySession.exercises[ex.name] = [];
  const sets = sessionData[ei] || {};
  todaySession.exercises[ex.name] = Object.values(sets);
  try { localStorage.setItem('fazer_history', JSON.stringify(history.slice(-60))); } catch(e){}
}

function showView(v) {
  currentView = v;
  document.getElementById('workout-view').style.display = v==='log' ? '' : 'none';
  document.getElementById('history-view').style.display = v==='history' ? '' : 'none';
  if (v==='history') renderHistory();
}

function renderHistory() {
  const container = document.getElementById('history-container');
  const relevant = history.filter(h => h.workout === currentWorkout).slice(-10).reverse();
  if (!relevant.length) {
    container.innerHTML = '<div style="font-size:14px;color:var(--color-text-tertiary);padding:12px 2px">No sessions logged yet.</div>';
    return;
  }
  container.innerHTML = relevant.map(session => {
    const rows = Object.entries(session.exercises).map(([name, sets]) => {
      const completed = sets.filter(s=>s.completed);
      const maxW = Math.max(...sets.map(s=>parseFloat(s.weight)||0));
      const val = maxW > 0 ? maxW+'kg' : (completed.length+' sets done');
      return `<div class="history-row"><span>${name}</span><span class="history-val">${val}</span></div>`;
    }).join('');
    return `<div class="history-card"><div class="history-date">${session.date} · Workout ${session.workout}</div>${rows}</div>`;
  }).join('');
}

renderExercises();
</script>
